name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every Monday and Thursday at 06:00 UTC
    - cron: '0 6 * * 1,4'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "WARNING: SUPABASE_URL or SUPABASE_ANON_KEY secret is missing."
            echo "Please set SUPABASE_URL and SUPABASE_ANON_KEY under repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Pinging Supabase Auth Service..."
          curl -s -f -X GET "${SUPABASE_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" > /dev/null

          echo "Pinging Supabase Postgres via PostgREST (keeps DB active)..."
          curl -s -f -X GET "${SUPABASE_URL}/rest/v1/organizations?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" > /dev/null

          echo "Supabase keep-alive ping successful. Project activity registered."
