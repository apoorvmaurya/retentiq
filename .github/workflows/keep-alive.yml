name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every Monday and Thursday at 06:00 UTC
    - cron: '0 6 * * 1,4'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
