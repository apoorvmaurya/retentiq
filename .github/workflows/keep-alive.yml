name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs twice daily at 06:30 and 18:30 UTC (12:00 PM / 12:00 AM IST).
    # Supabase pauses free projects that lack a few user database requests
    # each day over the week, so each run makes several small reads.
    - cron: '30 6,18 * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "WARNING: SUPABASE_URL or SUPABASE_ANON_KEY secret is missing."
            echo "Please set SUPABASE_URL and SUPABASE_ANON_KEY under repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Pinging Supabase Postgres via PostgREST (keeps DB active)..."
          ok=0
          for i in 1 2 3; do
            if curl -sS -f --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 3 \
              -X GET "${SUPABASE_URL}/rest/v1/organizations?select=id&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" > /dev/null; then
              ok=$((ok+1))
            else
              echo "WARNING: database read ${i} failed."
            fi
            sleep 3
          done
          echo "Supabase keep-alive: ${ok}/3 database reads succeeded."
          if [ "$ok" -lt 3 ]; then
            echo "ERROR: fewer than 3 database reads succeeded - project may be paused or unreachable."
            exit 1
          fi
