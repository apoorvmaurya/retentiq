[extend]
useDefault = true

[allowlist]
description = "Ignore example env files, test mock keys, and CI placeholder configurations"
paths = [
  '''^\.env\.example$''',
  '''^\.env\.local\.example$''',
  '''^\.github/workflows/.*''',
  '''^apps/ai-service/tests/.*''',
  '''^apps/api/src/.*\.test\.ts$''',
  '''^apps/web/src/.*\.test\.tsx?$'''
]
regexes = [
  '''your-.*-key''',
  '''test-key''',
  '''mock-key''',
  '''mock-anon-key''',
  '''placeholder'''
]
